# Playwright Core Configuration
# Default browser: CHROMIUM, FIREFOX, WEBKIT
default.browser=CHROMIUM

# Headless mode
headless=false

# Default timeout in milliseconds
default.timeout=30000
peek.timeout=1000
probe.timeout=10000

# Screenshot directory
screenshots.directory=screenshots

# Base URL (optional)
base.url=

# Viewport settings
viewport.width=1920
viewport.height=1080

# Slow motion (delay between actions in ms, useful for debugging)
slow.motion=0

# Trace recording
trace.enabled=false
trace.screenshots=true
trace.snapshots=true

